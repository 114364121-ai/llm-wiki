    let currentFilterType = 'all';
    let currentSourceFilter = 'all';

    function renderCards(data) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">查無符合條件的卡片</p>';
        return;
      }

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);

        const typeClass = `type-${item.type}`;
        const tagsHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join('');

        card.innerHTML = `
          <span class="card-type ${typeClass}">${item.typeLabel}</span>
          <h2 class="card-title">${item.title}</h2>
          <div class="card-subtitle">${item.subtitle}</div>
          <div class="card-summary-box">
            <span class="summary-badge">核心要義</span>
            <p class="card-excerpt">${item.excerpt}</p>
          </div>
          <div class="card-meta">
            <div class="tags">${tagsHtml}</div>
            <div class="action-label">${item.actionLabel || '🔍 查看深度解析 ➔'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCards(type) {
      currentFilterType = type;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      applyFilters();
    }

    function filterSource(src) {
      currentSourceFilter = src;
      document.querySelectorAll('.source-chip').forEach(chip => chip.classList.remove('active'));
      event.target.classList.add('active');
      applyFilters();
    }

    function searchCards() {
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('searchBox').value.toLowerCase().trim();

      const filtered = wikiData.filter(item => {
        const matchType = (currentFilterType === 'all') || (item.type === currentFilterType);
        const matchSource = (currentSourceFilter === 'all') || (item.sourceRef === currentSourceFilter) || (item.sourceRef === 'all');
        const matchSearch = !q || 
          item.title.toLowerCase().includes(q) || 
          item.subtitle.toLowerCase().includes(q) || 
          item.excerpt.toLowerCase().includes(q) || 
          item.tags.some(t => t.toLowerCase().includes(q));

        return matchType && matchSource && matchSearch;
      });

      renderCards(filtered);
    }

    function openModal(item) {
      const overlay = document.getElementById('modalOverlay');
      const body = document.getElementById('modalBody');
      body.innerHTML = item.details || `<h2>${item.title}</h2><p>${item.excerpt}</p>`;
      overlay.classList.add('active');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'modalOverlay' || e.target.className === 'modal-close') {
        document.getElementById('modalOverlay').classList.remove('active');
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // Initial render
    renderCards(wikiData);
  </script>
